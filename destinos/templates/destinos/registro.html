
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | TurismoCol</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #071b35, #123f68);
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #123f68;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #24364b;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1769aa;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104d80;
        }

        .messages {
            margin-bottom: 18px;
            color: #b42318;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>
<body>

    <main class="register-container">
        <h1>TurismoCol</h1>
        <p class="subtitle">Crea tu cuenta y descubre Colombia</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">Nombre de usuario</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Elige un usuario"
                required
            >

            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Ingresa tu correo"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Crea una contraseña"
                required
            >

            <label for="confirmar_password">Confirmar contraseña</label>
            <input
                type="password"
                id="confirmar_password"
                name="confirmar_password"
                placeholder="Repite tu contraseña"
                required
            >

            <button type="submit">Crear cuenta</button>
        </form>

        <div class="links">
            ¿Ya tienes una cuenta?
            <a href="{% url 'login' %}">Inicia sesión</a>
        </div>

        <a class="back" href="{% url 'home' %}">Volver al inicio</a>
    </main>

</body>
</html>
